<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Frames — Spot the Difference</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="title-block">
      <h1>Twin Frames</h1>
      <p id="subtitle">Spot the Difference</p>
    </div>
    <div id="hud">
      <div class="hud-item"><span class="hud-label">Level</span><span id="level-name">Harbor Sunset</span></div>
      <div class="hud-item"><span class="hud-label">Found</span><span id="found-count">0 / 7</span></div>
      <div class="hud-item"><span class="hud-label">Score</span><span id="score">0</span></div>
      <div class="hud-item"><span class="hud-label">Hints</span><span id="hints-left">3</span></div>
      <div class="hud-item timer"><span class="hud-label">Time</span><span id="time-text">120</span><div id="time-bar"><div id="time-fill"></div></div></div>
    </div>
  </header>

  <main id="boards">
    <figure class="panel" id="panel-a">
      <figcaption>Panel A</figcaption>
      <canvas id="canvas-a" width="640" height="480" aria-label="Left picture: find the differences"></canvas>
    </figure>
    <figure class="panel" id="panel-b">
      <figcaption>Panel B</figcaption>
      <canvas id="canvas-b" width="640" height="480" aria-label="Right picture: find the differences"></canvas>
    </figure>
  </main>

  <footer id="controls">
    <button id="btn-hint" type="button">Hint <kbd>H</kbd></button>
    <button id="btn-restart" type="button">Restart level <kbd>R</kbd></button>
    <button id="btn-next" type="button" hidden>Next level <kbd>N</kbd></button>
    <p id="help">Click a difference on either picture. Wrong clicks cost 25 points. Hints cost 50 points.</p>
  </footer>

  <div id="overlay" hidden>
    <div id="overlay-card">
      <h2 id="overlay-title">Twin Frames</h2>
      <p id="overlay-text">Two pictures, a few sneaky differences. Find them all before the clock runs out.</p>
      <p id="overlay-score" hidden></p>
      <button id="overlay-button" type="button">Start</button>
    </div>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
